[package]
name = "rosie"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
flate2 = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "1"
unicode-ident = "1"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"
