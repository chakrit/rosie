[package]
name = "rosie"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
clap = { version = "4.6.7", default-features = false, features = ["std", "derive", "help", "usage", "error-context", "suggestions"] }
flate2 = "1"
indicatif = { version = "0.18", default-features = false }
inquire = { version = "0.9.4", default-features = false, features = ["crossterm"] }
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = { version = "0.4", default-features = false }
thiserror = "2"
toml = "1"
toml_edit = { version = "0.22", features = ["serde"] }
unicode-ident = "1"
ureq = { version = "3", default-features = false, features = ["native-tls-no-default"] }

[dev-dependencies]
tempfile = "3"
