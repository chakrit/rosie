[package]
name = "rosie"
version = "0.1.0"
edition = "2024"
rust-version = "1.98.1"

[dependencies]
mlua = { version = "0.12.1", features = ["lua54", "vendored"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2"
toml = "1.1.6"
unicode-ident = "1.0.26"

[dev-dependencies]
tempfile = "3"
